name: Release Roll Curtain

on:
  push:
    branches:
      - main
      - beta
    paths:
      - "RollCurtain/**"
      - "tests/**"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          base_version="$(awk -F': ' '/^## Version:/ { print $2; exit }' RollCurtain/RollCurtain.toc | tr -d '\r')"
          if [[ -z "$base_version" ]]; then
            echo "Unable to read ## Version from RollCurtain/RollCurtain.toc" >&2
            exit 1
          fi

          channel="release"
          version="$base_version"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "beta" ]]; then
            channel="beta"
            git fetch --tags --force
            latest_beta="$(git tag -l "v${base_version}-beta.*" \
              | sed -n "s/^v${base_version//./\\.}-beta\.\([0-9][0-9]*\)$/\1/p" \
              | sort -n \
              | tail -n 1)"
            next_beta=$(( ${latest_beta:-0} + 1 ))
            version="${base_version}-beta.${next_beta}"
          fi

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check Lua syntax
        run: luac5.4 -p RollCurtain/*.lua tests/test_*.lua

      - name: Run tests
        shell: bash
        run: |
          for test_file in tests/test_*.lua; do
            echo "Running $test_file"
            lua5.4 "$test_file"
          done

  publish:
    if: github.event_name != 'pull_request'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Stamp packaged add-on metadata
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: |
          sed -i -E "s/^## Version:.*/## Version: $VERSION/" RollCurtain/RollCurtain.toc
          if grep -q '^## X-Release-Channel:' RollCurtain/RollCurtain.toc; then
            sed -i -E "s/^## X-Release-Channel:.*/## X-Release-Channel: $CHANNEL/" RollCurtain/RollCurtain.toc
          else
            sed -i "/^## Version:/a ## X-Release-Channel: $CHANNEL" RollCurtain/RollCurtain.toc
          fi
          grep -E '^## (Version|X-Release-Channel):' RollCurtain/RollCurtain.toc

      - name: Package add-on
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          zip -r "RollCurtain-$VERSION.zip" RollCurtain

      - name: Build release notes
        shell: bash
        env:
          BASE_VERSION: ${{ needs.release.outputs.base_version }}
          VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: |
          awk -v version="$BASE_VERSION" '
            $0 == "## " version { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES_BODY.md

          if [[ ! -s RELEASE_NOTES_BODY.md ]]; then
            echo "Development build for Roll Curtain $BASE_VERSION." > RELEASE_NOTES_BODY.md
          fi

          if [[ "$CHANNEL" == "beta" ]]; then
            {
              echo "**Beta build:** $VERSION"
              echo
              echo "This is a pre-release build intended for testing before promotion to the stable channel."
              echo
              cat RELEASE_NOTES_BODY.md
            } > RELEASE_NOTES.md
          else
            cp RELEASE_NOTES_BODY.md RELEASE_NOTES.md
          fi

      - name: Check for existing GitHub release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        shell: bash
        run: |
          prerelease_args=()
          if [[ "$CHANNEL" == "beta" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            "RollCurtain-$VERSION.zip#RollCurtain-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Roll Curtain v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            "${prerelease_args[@]}"
